<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القوائم وصفوف البيانات | عرض تفاعلي</title>
<!-- الخطوط (تعمل عند وجود إنترنت، وإلا يُستخدم خط النظام تلقائيًا) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">

<style>
/* =========================================================
   🎨 الألوان والهوية البصرية
   ========================================================= */
:root{
  --p:#6D28D9; --p2:#8B5CF6; --p3:#C4B5FD; --ps:#F3EEFF;
  --b:#2563EB; --b2:#60A5FA; --bs:#EAF2FF;
  --acc:#F59E0B; --accs:#FFF4DC; --pink:#EC4899; --mint:#10B981;
  --ok:#16A34A; --oks:#DCFCE7; --bad:#E11D48; --bads:#FFE4E6;
  --ink:#1E1640; --muted:#6B6488; --line:#E7E2F7;
  --code:#1D1736; --term:#110C22;
  --mono:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;
  --font:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font);background:#120C2A;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body.idle{cursor:none}
input{font-family:inherit;-webkit-user-select:text;user-select:text}
button{font-family:inherit;cursor:pointer}
[role=button]{cursor:pointer}
.mono{font-family:var(--mono)}
b{font-weight:800}

/* =========================================================
   🖥️ المسرح: 1920×1080 ثابت ويُكبَّر/يُصغَّر ليناسب أي شاشة (16:9)
   ========================================================= */
#viewport{position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(1200px 700px at 15% 10%,#3B2A80 0%,transparent 60%),radial-gradient(900px 600px at 90% 90%,#1E3A8A 0%,transparent 60%),#120C2A}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);transform-origin:center;overflow:hidden;
  background-color:#FCFBFF;
  background-image:linear-gradient(rgba(109,40,217,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(109,40,217,.045) 1px,transparent 1px);
  background-size:56px 56px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.6;pointer-events:none}
.blob.b1{width:640px;height:640px;background:#E9DDFF;top:-240px;right:-180px}
.blob.b2{width:580px;height:580px;background:#DCEBFF;bottom:-260px;left:-180px}
.blob.b3{width:320px;height:320px;background:#FFE9F4;bottom:60px;right:32%;opacity:.45}
/* خلفية بيانات: أرقام ثنائية خافتة */
.bits{position:absolute;font-family:var(--mono);font-size:22px;color:rgba(109,40,217,.10);letter-spacing:6px;pointer-events:none;white-space:nowrap;direction:ltr}
.bits.t{top:22px;left:40px}.bits.bt{bottom:22px;right:40px}

/* =========================================================
   🎞️ الشرائح والانتقالات
   ========================================================= */
.slide{position:absolute;inset:0;padding:58px 100px 140px;display:flex;flex-direction:column;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .55s ease,transform .7s cubic-bezier(.2,.8,.2,1),visibility 0s linear .7s}
.slide.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;
  transition:opacity .55s ease,transform .7s cubic-bezier(.2,.8,.2,1),visibility 0s}
.slide.enter{transition:none!important}
.slide.enter.t-slide{transform:translateX(var(--dx,-140px))}
.slide.enter.t-zoom{transform:scale(.9)}
.slide.leave.t-slide{transform:translateX(calc(var(--dx,-140px) * -1))}
.slide.leave.t-zoom{transform:scale(1.06)}
.slide.leave.t-fade{transform:none}

/* ظهور العناصر بالتتابع */
@keyframes rise{from{opacity:0;transform:translateY(38px)}to{opacity:1;transform:none}}
.slide.active .anim{animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 110ms + 220ms)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
@keyframes popIn{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(139,92,246,.45)}50%{box-shadow:0 0 0 18px rgba(139,92,246,0)}}
@keyframes blink{50%{opacity:0}}
.slide.active .shake{animation:shake .5s ease}
.slide.active .pop{animation:popIn .45s cubic-bezier(.2,.8,.2,1)}
.float-ico{display:inline-block;animation:floaty 3.2s ease-in-out infinite}

/* =========================================================
   🧩 عناصر عامة
   ========================================================= */
.s-head{display:flex;align-items:center;gap:26px;margin-bottom:30px;flex-shrink:0}
.badge{font-family:var(--font);background:var(--ps);color:var(--p);font-weight:800;font-size:26px;padding:10px 24px;border-radius:999px;border:2px solid #E2D6FF;white-space:nowrap}
.badge::before{content:"# ";font-family:var(--mono);opacity:.6}
.s-head h2{font-size:60px;font-weight:900;line-height:1.15;color:var(--ink)}
.s-body{flex:1;min-height:0;display:flex;gap:56px;align-items:center}
.s-body.col{flex-direction:column;justify-content:center;gap:26px}
.col-text{flex:1;display:flex;flex-direction:column;gap:22px;min-width:0}
.col-code{flex:1.05;display:flex;flex-direction:column;gap:18px;min-width:0}
.row{display:flex;align-items:center;justify-content:center}
.gap{gap:18px}
.lead{font-size:36px;font-weight:700;color:var(--muted);text-align:center;line-height:1.5}
.hint{font-size:28px;color:var(--muted);font-weight:700;text-align:center}
.points{list-style:none;display:flex;flex-direction:column;gap:16px}
.points li{font-size:36px;font-weight:700;line-height:1.45;padding-right:52px;position:relative}
.points li::before{content:"";position:absolute;right:6px;top:15px;width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--p2),var(--b2));transform:rotate(45deg)}
.note{font-size:30px;font-weight:700;background:var(--accs);border:2px dashed #F6C66B;color:#7A4B00;padding:18px 26px;border-radius:20px;line-height:1.5}
.predict-box{font-size:34px;font-weight:800;color:var(--p);background:var(--ps);border-radius:22px;padding:20px 28px;border-right:8px solid var(--p2)}
.grad{background:linear-gradient(90deg,var(--p),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}

/* الأزرار */
.btn{font-size:30px;font-weight:800;padding:16px 32px;border-radius:18px;border:none;color:#fff;
  background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 7px 0 #4C1D95,0 14px 24px -8px rgba(76,29,149,.5);
  transition:transform .15s ease,box-shadow .15s ease,filter .2s;white-space:nowrap}
.btn:hover{transform:translateY(-3px);filter:brightness(1.07)}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #4C1D95}
.btn.blue{background:linear-gradient(135deg,var(--b),var(--b2));box-shadow:0 7px 0 #1E40AF,0 14px 24px -8px rgba(30,64,175,.45)}
.btn.blue:active{box-shadow:0 2px 0 #1E40AF}
.btn.ghost{background:#fff;color:var(--p);border:3px solid var(--p3);box-shadow:0 6px 0 #DDD0FF}
.btn.ghost:active{box-shadow:0 1px 0 #DDD0FF}
.btn.sm{font-size:24px;padding:12px 22px}
.btn.run{background:linear-gradient(135deg,#059669,#10B981);box-shadow:0 7px 0 #065F46,0 14px 24px -8px rgba(6,95,70,.45)}
.btn.run:active{box-shadow:0 2px 0 #065F46}

/* صندوق الكود */
.code{background:var(--code);color:#EEEAFF;border-radius:24px;font-family:var(--mono);font-size:30px;line-height:1.55;direction:ltr;text-align:left;
  box-shadow:0 22px 50px -22px rgba(40,20,90,.6);overflow:hidden;border:2px solid #2E2650}
.code .bar{display:flex;gap:10px;align-items:center;padding:14px 22px;background:rgba(255,255,255,.05);font-size:19px;color:#A99FD6}
.code .bar i{width:14px;height:14px;border-radius:50%;display:inline-block}
.code .bar i:nth-child(1){background:#FF5F57}.code .bar i:nth-child(2){background:#FEBC2E}.code .bar i:nth-child(3){background:#28C840}
.code .bar .fn{margin-left:14px}.code .bar .lang{margin-left:auto;color:#FBBF24}
.code pre{margin:0;padding:18px 30px 24px;white-space:pre;font-family:inherit;overflow:hidden}
.code.sm{font-size:24px}.code.sm pre{padding:12px 24px 18px}
.c-kw{color:#FF7AC6;font-weight:600}.c-fn{color:#7DD3FC}.c-str{color:#86EFAC}.c-num{color:#FBBF24}.c-com{color:#8A82B5;font-style:italic}
.cursor{animation:blink 1s steps(1) infinite;color:#A78BFA}
/* شاشة المخرجات */
.term{background:var(--term);border-radius:20px;border:2px solid #2A2245;overflow:hidden;direction:ltr;text-align:left}
.term-bar{font-family:var(--mono);font-size:18px;color:#7E74AE;padding:10px 20px;background:rgba(255,255,255,.04)}
.term-body{font-family:var(--mono);font-size:28px;color:#86EFAC;padding:14px 24px 18px;min-height:110px;white-space:pre-wrap;line-height:1.5;margin:0}
.term-body.err{color:#FDA4AF}

/* المؤقت */
.timer{display:flex;align-items:center;gap:16px;background:#fff;border:3px solid var(--line);border-radius:24px;padding:12px 18px;flex-shrink:0}
.tm-ring{position:relative;width:110px;height:110px}
.tm-ring svg{width:110px;height:110px;transform:rotate(-90deg)}
.tm-bg{fill:none;stroke:#EEE8FF;stroke-width:11}
.tm-fg{fill:none;stroke:url(#tmGrad);stroke:var(--p2);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.tm-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:800;font-size:28px;color:var(--ink);direction:ltr}
.tm-btns{display:flex;flex-direction:column;gap:10px}
.tm-btns .btn{font-size:22px;padding:8px 16px}
.timer.warn .tm-fg{stroke:var(--acc)}
.timer.done{border-color:var(--bad);animation:glow 1.2s 3}
.timer.done .tm-txt{color:var(--bad)}

/* =========================================================
   1) شريحة العنوان
   ========================================================= */
.center-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;position:relative;z-index:1}
.pills{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.pill{background:#fff;border:2px solid var(--line);border-radius:999px;padding:10px 24px;font-size:26px;font-weight:700;color:var(--muted)}
.kicker{font-size:34px;font-weight:800;color:var(--b);letter-spacing:1px}
.hero{font-size:118px;font-weight:900;line-height:1.1;background:linear-gradient(90deg,var(--p),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 10px}
.hero-sub{font-family:var(--mono);font-size:40px;color:var(--p2);font-weight:600}
.title-code .code{font-size:32px;min-width:860px}
.meta{font-size:28px;color:var(--muted);font-weight:700}
.deco-code{position:absolute;inset:0;pointer-events:none;z-index:0}
.deco-code span{position:absolute;font-family:var(--mono);font-weight:800;color:rgba(109,40,217,.13);font-size:110px;animation:floaty 5s ease-in-out infinite;direction:ltr}
.deco-code span:nth-child(2n){color:rgba(37,99,235,.12);animation-duration:6.5s}

/* =========================================================
   بطاقات القلب (مراجعة)
   ========================================================= */
.flip-grid{display:grid;gap:28px;width:100%}
.flip-grid.cols-4{grid-template-columns:repeat(4,1fr)}
.flip-grid.cols-3{grid-template-columns:repeat(3,1fr)}
.flip-grid.cols-2{grid-template-columns:repeat(2,1fr)}
.flip-card{perspective:1400px;height:330px}
.flip-grid.cols-3 .flip-card{height:250px}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip-card.flipped .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:26px;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fc-front{background:#fff;border:3px solid var(--line);box-shadow:0 18px 40px -20px rgba(80,50,160,.35);transition:border-color .2s,transform .2s}
.flip-card:hover .fc-front{border-color:var(--p3)}
.fc-back{background:linear-gradient(145deg,var(--p),var(--b));color:#fff;transform:rotateY(180deg)}
.fc-ico{font-size:64px}
.fc-q{font-size:32px;font-weight:800;line-height:1.35}
.fc-tap{font-size:20px;color:var(--p2);font-weight:700}
.fc-a{font-size:31px;font-weight:700;line-height:1.5}
.fc-a .mono{font-size:26px}

/* =========================================================
   الأهداف
   ========================================================= */
.goals{flex:1.4;display:flex;flex-direction:column;gap:16px}
.goal{display:flex;align-items:center;gap:20px;background:#fff;border:2px solid var(--line);border-radius:22px;padding:16px 24px;font-size:32px;font-weight:700;box-shadow:0 10px 24px -18px rgba(80,50,160,.4)}
.g-num{font-family:var(--mono);width:52px;height:52px;flex-shrink:0;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--p),var(--b));color:#fff;font-weight:800;font-size:26px}
.g-ico{font-size:36px}
.goals-side{flex:1;display:flex;flex-direction:column;align-items:center;gap:20px}
.goals-side .code{font-size:26px;width:100%}
.big-emoji{font-size:120px}

/* =========================================================
   فك الشيفرة
   ========================================================= */
.cipher-key{display:flex;align-items:center;gap:26px}
.ck-label{font-size:30px;font-weight:800;color:var(--p)}
.key-row{display:flex;gap:14px}
.kbox{width:108px;border-radius:20px;background:#fff;border:3px solid var(--line);overflow:hidden;text-align:center;transition:all .3s}
.kl{font-size:58px;font-weight:900;padding:6px 0 2px;color:var(--ink)}
.ki{font-family:var(--mono);font-size:24px;font-weight:800;background:var(--bs);color:var(--b);padding:4px 0}
.kbox.hit{border-color:var(--acc);transform:translateY(-10px);box-shadow:0 16px 30px -12px rgba(245,158,11,.6)}
.kbox.hit .ki{background:var(--acc);color:#fff}
.cipher .code{font-size:34px}
.slot-row{display:flex;gap:16px;direction:rtl}
.slot{width:118px;height:132px;border-radius:24px;background:linear-gradient(160deg,#2B2152,#1D1736);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:3px solid #3B3070;transition:transform .2s}
.slot:hover{transform:translateY(-5px)}
.slot .sl{font-size:58px;font-weight:900;color:#C4B5FD}
.slot .si{font-family:var(--mono);font-size:22px;color:#FBBF24}
.slot.open{background:linear-gradient(160deg,#8B5CF6,#2563EB);border-color:#fff;animation:popIn .45s}
.slot.open .sl{color:#fff}
.cipher-result{font-size:40px;font-weight:800;color:var(--ok);opacity:0;transform:scale(.8);transition:all .5s cubic-bezier(.2,.8,.2,1)}
.cipher-result.show{opacity:1;transform:none}
.cipher-result b{font-size:52px}

/* =========================================================
   جامع البيانات (ماذا تتوقعين؟)
   ========================================================= */
.data-src{flex:1;display:flex;flex-direction:column;gap:18px}
.ds-title{font-size:30px;font-weight:800;color:var(--b)}
.packets{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.packet{background:#fff;border:3px solid var(--line);border-radius:22px;padding:16px 10px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;transition:all .2s;position:relative}
.packet:hover{border-color:var(--b2);transform:translateY(-5px)}
.packet .pe{font-size:44px}
.packet .pv{font-family:var(--mono);font-size:28px;font-weight:800;color:var(--ink);direction:ltr}
.packet .pt{font-size:19px;font-weight:700;color:#fff;border-radius:999px;padding:3px 14px}
.packet.used{opacity:.35;transform:scale(.94);pointer-events:none}
.t-int{background:#F59E0B}.t-float{background:#EC4899}.t-str{background:#10B981}.t-bool{background:#6366F1}
.data-side{flex:1.15;display:flex;flex-direction:column;gap:16px}
.mem{background:linear-gradient(160deg,#F5F0FF,#EAF2FF);border:3px dashed var(--p3);border-radius:26px;padding:16px 20px;min-height:170px}
.mem-head{font-size:26px;font-weight:800;color:var(--p);display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mem-head .cnt{font-family:var(--mono);background:var(--p);color:#fff;border-radius:12px;padding:2px 14px;direction:ltr}
.mem-items{display:flex;flex-wrap:wrap;gap:10px;direction:ltr}
.mchip{display:flex;flex-direction:column;align-items:center;background:#fff;border:2px solid var(--p3);border-radius:14px;padding:4px 14px;animation:popIn .4s;cursor:pointer}
.mchip small{font-family:var(--mono);font-size:17px;color:var(--b);font-weight:800}
.mchip span{font-family:var(--mono);font-size:24px;font-weight:700}
.mem-empty{font-size:24px;color:var(--muted);text-align:center;padding-top:30px}
.data-side .code{font-size:24px}
.predict{display:flex;flex-direction:column;gap:12px;background:#fff;border:2px solid var(--line);border-radius:22px;padding:16px 22px}
.pq{font-size:30px;font-weight:800;line-height:1.4}
.pa{font-size:28px;font-weight:700;color:var(--ok);line-height:1.5;opacity:0;max-height:0;overflow:hidden;transition:all .5s}
.pa.show{opacity:1;max-height:200px}
.predict .btn{align-self:flex-start}

/* =========================================================
   العصف الذهني
   ========================================================= */
.bs-area{position:relative;width:100%;flex:1;min-height:0}
.bs-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:330px;height:330px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#A78BFA,#6D28D9 60%,#4C1D95);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:36px;font-weight:900;line-height:1.3;padding:30px;box-shadow:0 30px 60px -20px rgba(76,29,149,.6);animation:glow 2.8s infinite}
.bs-center .mono{font-size:28px;color:#FDE68A;margin-top:8px}
.bs-idea{position:absolute;transform:translate(-50%,-50%);background:#fff;border:3px solid var(--c,#8B5CF6);color:var(--ink);font-size:29px;font-weight:800;padding:14px 26px;border-radius:999px;white-space:nowrap;box-shadow:0 14px 30px -14px rgba(60,30,140,.45);animation:bsPop .5s cubic-bezier(.2,.8,.2,1)}
.bs-idea.mine{background:var(--c,#8B5CF6);color:#fff}
@keyframes bsPop{from{transform:translate(-50%,-50%) scale(0)}to{transform:translate(-50%,-50%) scale(1)}}
.bs-tools{display:flex;gap:16px;align-items:center;justify-content:center;flex-shrink:0}
.bs-in{font-size:28px;padding:14px 22px;border-radius:16px;border:3px solid var(--line);width:520px;outline:none;color:var(--ink)}
.bs-in:focus{border-color:var(--p2)}

/* =========================================================
   مخطط هياكل البيانات
   ========================================================= */
.tree{gap:18px!important;justify-content:flex-start!important}
.t-root{display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,#0F4C81,#1E3A8A);color:#fff;border-radius:22px;padding:14px 36px;box-shadow:0 16px 30px -14px rgba(30,58,138,.6);transition:transform .2s}
.t-root:hover{transform:translateY(-4px)}
.t-root>span{font-size:44px}
.t-root b{font-size:36px;display:block}
.t-root small,.t-head small{font-family:var(--mono);font-size:20px;opacity:.85}
.t-def{font-size:28px;font-weight:700;color:var(--muted)}
.tz{opacity:0;transform:translateY(20px) scale(.97);transition:all .5s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.tz.show{opacity:1;transform:none;pointer-events:auto}
.t-lvl1{display:flex;gap:28px;width:100%;align-items:flex-start}
.t-branch{flex:1;background:#fff;border:3px solid var(--line);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px}
.t-branch.wide{flex:1.9}
.t-head{background:#475569;color:#fff;border-radius:16px;padding:10px 18px;text-align:center;transition:transform .2s}
.t-head:hover{transform:translateY(-3px)}
.t-head b{font-size:28px;display:block}
.t-head.small{background:#64748B}
.t-head.small b{font-size:24px}
.t-note{font-size:21px;color:var(--muted);font-weight:700;text-align:center}
.t-sub{display:flex;gap:16px}
.t-group{flex:1;display:flex;flex-direction:column;gap:8px}
.t-group:first-child{flex:1.7}
.leaves{display:grid;grid-template-columns:1fr;gap:9px}
.leaves.two{grid-template-columns:1fr 1fr}
.leaf{background:#F1F5F9;border:2px solid #E2E8F0;border-radius:14px;padding:7px 12px;text-align:center;position:relative}
.leaf b{font-size:23px;display:block}
.leaf span{font-family:var(--mono);font-size:17px;color:var(--b)}
.leaf.star{background:linear-gradient(135deg,#FFF7DB,#FFE9A8);border-color:#F6C66B}
.leaf em{position:absolute;top:-14px;left:8px;font-style:normal;font-size:15px;font-weight:800;background:var(--acc);color:#fff;border-radius:999px;padding:1px 10px}

/* =========================================================
   الفهرسة
   ========================================================= */
.idx-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;direction:ltr}
.idx-line{display:flex;gap:22px;align-items:center}
.idx-tag{width:150px;font-family:var(--font);font-size:22px;font-weight:800;color:var(--muted);text-align:center;direction:rtl}
.ib{width:190px;font-family:var(--mono);font-size:30px;font-weight:800;padding:8px 0;border-radius:14px;border:3px solid #BFDBFE;background:var(--bs);color:var(--b);transition:all .2s}
.ib:hover{transform:translateY(-3px)}
.ib.neg{border-color:#FBCFE8;background:#FDF2F8;color:var(--pink)}
.ib.on{background:var(--b);color:#fff;border-color:var(--b)}
.ib.neg.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.ibox{width:190px;height:150px;border-radius:24px;background:#fff;border:4px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:all .3s;cursor:pointer}
.ibox .ie{font-size:56px}
.ibox .iv{font-family:var(--mono);font-size:24px;font-weight:700}
.ibox.hl{border-color:var(--acc);background:var(--accs);transform:translateY(-8px) scale(1.04);box-shadow:0 20px 34px -16px rgba(245,158,11,.7)}
.ibox.good{border-color:var(--ok);background:var(--oks)}
.idx-bottom{display:flex;gap:30px;width:100%;align-items:stretch}
.idx-bottom .code{flex:1.2;font-size:26px}
.idx-bottom .term{flex:1}
.idx-bottom .term-body{font-size:32px;min-height:80px}
.idx-quiz{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.iq-text{font-size:30px;font-weight:800;color:var(--p);min-width:520px;text-align:center}
.iq-text .mono{direction:ltr;display:inline-block;color:var(--pink)}

/* =========================================================
   فكر – زاوج – شارك
   ========================================================= */
.phases{display:flex;flex-direction:column;gap:16px}
.phase{display:flex;align-items:center;gap:20px;background:#fff;border:3px solid var(--line);border-radius:24px;padding:18px 24px;transition:all .25s}
.phase:hover{border-color:var(--p3)}
.phase.on{border-color:var(--p2);background:var(--ps);transform:scale(1.03);box-shadow:0 18px 30px -18px rgba(109,40,217,.55)}
.ph-ico{font-size:54px}
.phase b{font-size:36px;display:block}
.phase small{font-size:24px;color:var(--muted);font-weight:700}
.ph-t{margin-right:auto;font-family:var(--mono);font-size:24px;font-weight:800;color:var(--p);background:#fff;border:2px solid var(--p3);border-radius:12px;padding:4px 12px}
.type-tps .code{font-size:26px}
.tps-timer{display:flex;justify-content:center}

/* =========================================================
   الدوال الجاهزة (رسم أعمدة)
   ========================================================= */
.bars{display:flex;gap:34px;align-items:flex-end;justify-content:center;height:470px;padding:0 20px;border-bottom:4px solid var(--line);direction:ltr}
.bar-w{display:flex;flex-direction:column;align-items:center;gap:10px}
.gbar{width:130px;height:var(--h);border-radius:20px 20px 8px 8px;background:linear-gradient(180deg,var(--p2),var(--b));position:relative;transition:all .4s;display:flex;align-items:flex-start;justify-content:center}
.gbar .bv{font-family:var(--mono);font-size:32px;font-weight:800;color:#fff;margin-top:14px}
.gbar .bc{position:absolute;bottom:14px;width:52px;height:52px;border-radius:50%;background:#fff;color:var(--p);font-family:var(--mono);font-weight:800;font-size:26px;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.4);transition:all .35s}
.gbar.counted .bc{opacity:1;transform:none}
.gbar .crown{position:absolute;top:-62px;font-size:52px;opacity:0;transition:all .4s}
.gbar.top{background:linear-gradient(180deg,#FBBF24,#F59E0B)}
.gbar.top .crown{opacity:1}
.gbar.low{background:linear-gradient(180deg,#F472B6,#DB2777)}
.gbar.sumglow{filter:brightness(1.18);box-shadow:0 0 0 6px rgba(16,185,129,.35)}
.gbar.dim{opacity:.35}
.bi{font-family:var(--mono);font-size:22px;color:var(--muted);font-weight:800}
.fbtns{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fbtn{background:#fff;border:3px solid var(--line);border-radius:22px;padding:14px 18px;text-align:center;transition:all .2s}
.fbtn:hover{border-color:var(--p2);transform:translateY(-3px)}
.fbtn.on{border-color:var(--p);background:var(--ps)}
.fbtn b{font-family:var(--mono);font-size:34px;color:var(--p);display:block;direction:ltr}
.fbtn small{font-size:22px;font-weight:700;color:var(--muted)}
.sum-badge{font-family:var(--mono);font-size:34px;font-weight:800;color:var(--ok);text-align:center;height:46px}

/* =========================================================
   مختبر القائمة
   ========================================================= */
.lab-list{display:flex;flex-wrap:wrap;gap:12px;direction:ltr;min-height:118px;align-items:center;justify-content:center;background:#fff;border:3px dashed var(--p3);border-radius:26px;padding:18px}
.lab-list::before{content:"[";font-family:var(--mono);font-size:64px;color:var(--p3);font-weight:800}
.lab-list::after{content:"]";font-family:var(--mono);font-size:64px;color:var(--p3);font-weight:800}
.lchip{display:flex;flex-direction:column;align-items:center;background:linear-gradient(160deg,var(--ps),var(--bs));border:3px solid var(--p3);border-radius:16px;padding:4px 18px;min-width:90px}
.lchip small{font-family:var(--mono);font-size:18px;font-weight:800;color:var(--b)}
.lchip span{font-family:var(--mono);font-size:32px;font-weight:800}
.lchip.new{animation:popIn .45s;border-color:var(--acc)}
.lchip.match{border-color:var(--ok);background:var(--oks)}
.lempty{font-family:var(--mono);font-size:28px;color:var(--muted)}
.lab-ops{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.lop{font-family:var(--mono);font-size:24px;font-weight:800;padding:14px 8px;border-radius:16px;border:3px solid var(--line);background:#fff;color:var(--p);transition:all .2s;direction:ltr}
.lop:hover{border-color:var(--p2);transform:translateY(-3px)}
.lop small{display:block;font-family:var(--font);font-size:18px;color:var(--muted);direction:rtl}
.lop.reset{color:var(--muted)}
.lab-in-row{display:flex;gap:14px;align-items:center}
.lab-in-row label{font-size:26px;font-weight:800;color:var(--muted)}
.lab-in{font-family:var(--mono);font-size:30px;padding:10px 18px;width:240px;border-radius:14px;border:3px solid var(--line);outline:none;direction:ltr;text-align:center}
.lab-in:focus{border-color:var(--p2)}
.lab-right .code{font-size:24px}
.lab-right .term-body{font-size:26px;min-height:80px}

/* =========================================================
   الصف Tuple
   ========================================================= */
.tup-row{display:flex;gap:14px;align-items:center;justify-content:center;direction:ltr}
.tup-row .par{font-family:var(--mono);font-size:80px;font-weight:800;color:var(--b2)}
.tchip{position:relative;background:#fff;border:4px solid #BFDBFE;border-radius:20px;padding:16px 22px;font-family:var(--mono);font-size:30px;font-weight:800;text-align:center}
.tchip small{display:block;font-size:18px;color:var(--b)}
.tchip .lk{position:absolute;top:-22px;right:-14px;font-size:34px}
.tup-row.denied .tchip{border-color:var(--bad);background:var(--bads)}
.err-call{font-size:28px;font-weight:800;color:var(--bad);opacity:0;transition:opacity .4s;text-align:center}
.err-call.show{opacity:1}

/* =========================================================
   جدول المقارنة
   ========================================================= */
.cmp{width:100%;max-width:1500px;border-radius:26px;overflow:hidden;border:3px solid var(--line);background:#fff}
.cmp-row{display:grid;grid-template-columns:1fr 1.3fr 1.3fr;border-top:2px solid var(--line);transition:background .3s}
.cmp-row>div{padding:16px 24px;font-size:30px;font-weight:700;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px}
.cmp-h{border-top:none}
.cmp-h>div{background:linear-gradient(135deg,var(--p),var(--b));color:#fff;font-size:32px;font-weight:900}
.cmp-k{background:#F8F6FF;color:var(--p);font-weight:800!important}
.cmp-row.hide .cmp-v{color:transparent;position:relative}
.cmp-row.hide .cmp-v::after{content:"؟";position:absolute;color:var(--p3);font-size:40px;font-weight:900}
.cmp-row.hide:hover{background:#FBF9FF}
.cmp-v .mono{direction:ltr;display:inline-block}

/* =========================================================
   ربط بالوطن والدين والمادة 34
   ========================================================= */
.values{gap:22px!important}
.v-top{display:flex;gap:30px;align-items:center;justify-content:center}
.v-top .code{font-size:28px}
.v-chips{display:flex;gap:14px}
.v-chip{background:linear-gradient(135deg,#065F46,#10B981);color:#fff;font-size:30px;font-weight:900;border-radius:18px;padding:14px 24px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 24px -12px rgba(6,95,70,.6)}
.v-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;width:100%}
.v-card{position:relative;border-radius:28px;padding:22px 26px;background:#fff;border:3px solid var(--line);display:flex;flex-direction:column;gap:12px;height:390px;overflow:hidden;transition:transform .25s,border-color .25s}
.v-card:hover{transform:translateY(-5px)}
.v-card::before{content:"";position:absolute;inset:0 0 auto 0;height:10px;background:var(--vc)}
.v-card.rel{--vc:linear-gradient(90deg,#0E7C66,#34D399)}
.v-card.home{--vc:linear-gradient(90deg,#006C35,#22C55E)}
.v-card.law{--vc:linear-gradient(90deg,var(--p),var(--b))}
.vc-head{display:flex;align-items:center;gap:14px}
.vc-ico{font-size:50px}
.vc-head b{font-size:32px}
.vc-quote{font-size:28px;font-weight:800;line-height:1.6;color:var(--ink);filter:blur(9px);opacity:.3;transition:all .6s}
.v-card.rel .vc-quote{font-size:34px;color:#0E7C66;text-align:center}
.vc-link{font-size:23px;font-weight:700;line-height:1.55;color:var(--muted);filter:blur(9px);opacity:.25;transition:all .6s .15s}
.vc-tap{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;font-size:24px;font-weight:800;padding:10px 26px;border-radius:999px;transition:opacity .3s;white-space:nowrap}
.v-card.open .vc-quote,.v-card.open .vc-link{filter:none;opacity:1}
.v-card.open .vc-tap{opacity:0}
.v-err{font-family:var(--mono);font-size:24px;color:var(--bad);font-weight:700;min-width:700px;text-align:left}
.v-err .ar{font-family:var(--font);display:block;color:var(--ok);font-size:28px;font-weight:900;direction:rtl;text-align:right}

/* =========================================================
   شرائح الربط
   ========================================================= */
.lk-quote{position:relative;background:#fff;border:3px solid var(--line);border-radius:30px;padding:34px 36px 30px;display:flex;flex-direction:column;gap:16px;min-height:330px;justify-content:center;overflow:hidden;transition:transform .25s;box-shadow:0 20px 40px -26px rgba(80,50,160,.45)}
.lk-quote:hover{transform:translateY(-4px)}
.lk-quote::before{content:"";position:absolute;inset:0 0 auto 0;height:12px;background:var(--lc)}
.lk-quote.math{--lc:linear-gradient(90deg,#2563EB,#60A5FA)}
.lk-quote.rel{--lc:linear-gradient(90deg,#0E7C66,#34D399)}
.lk-quote.home{--lc:linear-gradient(90deg,#006C35,#22C55E)}
.lk-quote.law{--lc:linear-gradient(90deg,var(--p),var(--b))}
.lq-label{font-size:28px;font-weight:800;color:var(--p)}
.lk-quote.rel .lq-label,.lk-quote.home .lq-label{color:#0E7C66}
.lq-text{font-size:44px;font-weight:900;line-height:1.6;color:var(--ink);filter:blur(10px);opacity:.3;transition:all .6s}
.lk-quote.law .lq-text{font-size:36px}
.lk-quote.rel .lq-text{color:#0E7C66;font-size:52px;text-align:center}
.lq-src{font-size:26px;font-weight:700;color:var(--muted);filter:blur(10px);opacity:.3;transition:all .6s .15s}
.lk-quote.open .lq-text,.lk-quote.open .lq-src{filter:none;opacity:1}
.lk-quote.open .vc-tap{opacity:0}
.lk-quote .vc-tap{top:55%}
.lk-link{font-size:30px;font-weight:700;line-height:1.6;background:var(--ps);border-radius:22px;padding:18px 26px;border-right:8px solid var(--p2)}
.lk-link .mono{direction:ltr;display:inline-block;color:var(--p)}
.lk-chips{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;background:#fff;border:3px dashed #BFDBFE;border-radius:24px;padding:12px 14px}
.lk-chips .par{font-family:var(--mono);font-size:56px;color:var(--b2);font-weight:800}
.lkc{background:#fff;border:3px solid #BFDBFE;border-radius:16px;padding:6px 16px;text-align:center;cursor:pointer;transition:all .25s}
.lkc:hover{transform:translateY(-3px);border-color:var(--b2)}
.lkc small{font-family:var(--mono);font-size:16px;font-weight:800;color:var(--b);display:block}
.lkc b{font-family:var(--mono);font-size:26px;display:block}
.lkc span{font-size:19px;color:var(--muted);font-weight:700}
.lkc.on{border-color:var(--acc);background:var(--accs);transform:translateY(-6px);box-shadow:0 14px 24px -12px rgba(245,158,11,.7)}
.lk-chips.many{gap:7px;padding:10px}
.lk-chips.many .par{font-size:40px}
.lk-chips.many .lkc{padding:3px 9px;border-radius:12px}
.lk-chips.many .lkc b{font-size:17px}
.lk-chips.many .lkc span{font-size:15px}
.lk-chips.many .lkc small{font-size:13px}
.lk-chips.denied .lkc{border-color:var(--bad);background:var(--bads)}
.type-link .code{font-size:23px}
.type-link .term-body{font-size:26px;min-height:76px}
.lk-acts{justify-content:flex-start;flex-wrap:wrap}

/* =========================================================
   الأسئلة (اختيار من متعدد)
   ========================================================= */
.q-card{width:100%;max-width:1500px;background:#fff;border:3px solid var(--line);border-radius:30px;padding:28px 40px;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center;box-shadow:0 20px 40px -26px rgba(80,50,160,.4)}
.q-num{font-size:24px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--p),var(--b));border-radius:999px;padding:6px 22px}
.q-text{font-size:52px;font-weight:900;line-height:1.35}
.q-card .code{font-size:30px;min-width:700px}
.opts{display:grid;gap:22px;width:100%;max-width:1500px}
.opts.cols-2{grid-template-columns:repeat(2,1fr)}
.opts.cols-3{grid-template-columns:repeat(3,1fr)}
.opts.cols-4{grid-template-columns:repeat(4,1fr)}
.opt{display:flex;align-items:center;gap:20px;background:#fff;border:4px solid var(--line);border-radius:26px;padding:22px 28px;font-size:38px;font-weight:800;color:var(--ink);text-align:right;transition:transform .2s,border-color .2s,background .2s;box-shadow:0 8px 0 #ECE7FA}
.opt:hover{transform:translateY(-4px);border-color:var(--p3)}
.opt .o-ico{width:66px;height:66px;flex-shrink:0;border-radius:18px;background:var(--ps);display:flex;align-items:center;justify-content:center;font-size:38px}
.opt .o-t.mono{direction:ltr;font-size:34px}
.opt.correct{background:var(--oks);border-color:var(--ok);box-shadow:0 8px 0 #A7E8BD}
.opt.correct .o-ico{background:var(--ok);color:#fff}
.opt.wrong{background:var(--bads);border-color:var(--bad);box-shadow:0 8px 0 #FBC4CF;opacity:.75}
.opt:disabled{cursor:default}
.feedback{font-size:40px;font-weight:900;height:56px;text-align:center}
.feedback.ok{color:var(--ok)}.feedback.no{color:var(--pink)}
.explain{font-size:28px;font-weight:700;color:var(--muted);text-align:center;opacity:0;transition:opacity .4s;min-height:40px}
.explain.show{opacity:1}

/* =========================================================
   صح أم خطأ
   ========================================================= */
.tf-list{width:100%;max-width:1600px;display:flex;flex-direction:column;gap:14px}
.tf-row{display:grid;grid-template-columns:1fr auto;gap:10px 20px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:22px;padding:14px 24px;transition:all .3s}
.tf-s{font-size:31px;font-weight:800}
.tf-s .mono{direction:ltr;display:inline-block;color:var(--p)}
.tf-btns{display:flex;gap:12px}
.tfb{font-size:26px;font-weight:900;padding:10px 24px;border-radius:14px;border:3px solid;background:#fff;transition:all .2s}
.tfb.t{border-color:#86EFAC;color:var(--ok)}.tfb.f{border-color:#FDA4AF;color:var(--bad)}
.tfb:hover{transform:translateY(-3px)}
.tfb.t.sel{background:var(--ok);color:#fff;border-color:var(--ok)}
.tfb.f.sel{background:var(--bad);color:#fff;border-color:var(--bad)}
.tf-why{grid-column:1/-1;font-size:24px;font-weight:700;color:var(--ok);display:none}
.tf-row.ok{border-color:var(--ok);background:#F6FFF8}
.tf-row.ok .tf-why{display:block}
.tf-row.no{border-color:var(--pink)}
.tf-score{font-size:32px;font-weight:900;color:var(--p)}

/* =========================================================
   تحدي الدقيقة
   ========================================================= */
.ch-top{display:flex;gap:28px;align-items:center;justify-content:center}
.ch-top .code{font-size:30px}
.ch-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;width:100%}
.ch-cell{background:#fff;border:3px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.mini{font-family:var(--mono);font-size:21px;line-height:1.45;background:var(--code);color:#EEEAFF;padding:12px 16px;direction:ltr;text-align:left;white-space:pre;flex:1;margin:0}
.ch-res{padding:10px 12px;text-align:center;min-height:56px;display:flex;align-items:center;justify-content:center;transition:background .3s}
.ch-res .q{font-size:22px;font-weight:800;color:var(--p2)}
.ch-res .a{display:none;font-family:var(--mono);font-size:18px;font-weight:800;color:var(--ok);line-height:1.35}
.ch-res.open{background:var(--oks)}
.ch-res.open .q{display:none}.ch-res.open .a{display:block}

/* =========================================================
   التعلم التعاوني
   ========================================================= */
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.role{background:#fff;border:3px solid var(--line);border-radius:20px;padding:12px 6px;text-align:center}
.role span{font-size:42px;display:block}
.role b{font-size:22px}
.steps{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;font-size:29px;font-weight:700;line-height:1.4;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 18px 12px 18px;display:flex;gap:16px;align-items:center}
.steps li::before{content:counter(s);font-family:var(--mono);flex-shrink:0;width:44px;height:44px;border-radius:12px;background:var(--b);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:22px}
.steps li .mono{direction:ltr;display:inline-block;color:var(--p)}
.sol .code{font-size:23px}
.sol .ln{display:inline;transition:filter .5s,opacity .5s}
.sol .ln.hid{filter:blur(8px);opacity:.35}
.task-top{display:flex;justify-content:center}

/* =========================================================
   التقييم الفوري
   ========================================================= */
.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;width:100%;max-width:1500px}
.rate{background:#fff;border:4px solid var(--line);border-radius:30px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;transition:all .2s}
.rate:hover{transform:translateY(-6px);border-color:var(--p3)}
.rate .re{font-size:96px}
.rate b{font-size:30px;line-height:1.35}
.rate .rc{font-family:var(--mono);font-size:44px;font-weight:800;color:var(--p);background:var(--ps);border-radius:18px;padding:4px 28px}
.rate.bump .rc{animation:popIn .35s}
.exit{font-size:32px;font-weight:700;background:var(--accs);border:3px dashed #F6C66B;border-radius:24px;padding:18px 30px;max-width:1500px;text-align:center;line-height:1.5}

/* =========================================================
   الختام
   ========================================================= */
.huge{font-size:110px}

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
const head = d => `<header class="s-head anim">${d.badge?`<span class="badge">${d.badge}</span>`:''}<h2>${d.title}</h2></header>`;

/* تلوين كود بايثون */
const PY_KW = new Set(['for','in','if','else','elif','while','def','return','and','or','not','True','False','None','import','from']);
const PY_FN = new Set(['print','input','len','sum','max','min','range','append','remove','count','sort','reverse','clear','int','str','float']);
function hl(code){
  const re = /(#[^\n]*)|("[^"\n]*"|'[^'\n]*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))){
    out += esc(code.slice(last, m.index));
    if (m[1]) out += `<span class="c-com">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="c-str">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="c-num">${m[3]}</span>`;
    else { const w = m[4]; out += PY_KW.has(w) ? `<span class="c-kw">${w}</span>` : PY_FN.has(w) ? `<span class="c-fn">${w}</span>` : w; }
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}

  `<div class="code ${cls}"><div class="bar"><i></i><i></i><i></i><span class="fn">${file}</span><span class="lang">🐍 Python</span></div><pre><code>${hl(code)}</code></pre></div>`;

/* كتابة المخرجات حرفًا حرفًا */
function typeOut(el, text, isErr=false){
  clearInterval(el._t);
  el.classList.toggle('err', !!isErr);
  el.textContent = '';
  let i = 0;
  const step = Math.max(1, Math.ceil(text.length / 45));
  el._t = setInterval(() => {
    i += step; el.textContent = text.slice(0, i);
    if (i >= text.length){ clearInterval(el._t); isErr ? Sound.wrong() : Sound.pop(); }
  }, 22);
}

/* =====================================================================
   🔊 الأصوات (Web Audio API — بدون ملفات خارجية)
   ===================================================================== */
const Sound = {
  ctx:null, buf:null,
  c(){
    try{
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    }catch(e){ return null; }
  },
  noise(c){
    if (this.buf) return this.buf;
    const b = c.createBuffer(1, c.sampleRate, c.sampleRate), d = b.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    return (this.buf = b);
  },
  tone(f, t, dur, type='sine', vol=.2, f2){
    const c = this.c(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t+dur);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+.015);
    g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05);
  },
  /* تصفيق جماعي قصير */
  clap(){
    const c = this.c(); if (!c) return;
    const now = c.currentTime, buf = this.noise(c), dur = 1.6;
    const master = c.createGain(); master.gain.value = .9; master.connect(c.destination);
    for (let k=0;k<46;k++){
      const t = now + Math.pow(Math.random(), 1.25) * dur;
      const src = c.createBufferSource(); src.buffer = buf;
      const hp = c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 600;
      const bp = c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = 900 + Math.random()*1700; bp.Q.value = .8 + Math.random();
      const g = c.createGain();
      const fade = Math.max(.15, 1 - (t-now)/dur*.85), peak = (.35 + Math.random()*.45) * fade;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t+.003);
      g.gain.exponentialRampToValueAtTime(.0001, t+.06+Math.random()*.08);
      src.connect(hp); hp.connect(bp); bp.connect(g); g.connect(master);
      src.start(t, Math.random()*.5, .2);
    }
  },
  success(){ const c=this.c(); if(!c) return; const n=c.currentTime;
    [523.25,659.25,783.99,1046.5].forEach((f,k)=>this.tone(f, n+k*.09, .3, 'triangle', .22));
    this.tone(1318.5, n+.38, .45, 'sine', .12); },
  wrong(){ const c=this.c(); if(!c) return; const n=c.currentTime;
    this.tone(330, n, .18, 'sine', .16); this.tone(247, n+.16, .32, 'sine', .16); },
  pop(){ const c=this.c(); if(!c) return; this.tone(620, c.currentTime, .1, 'sine', .12, 980); },
  tick(){ const c=this.c(); if(!c) return; this.tone(1250, c.currentTime, .05, 'square', .04); },
  timeUp(){ const c=this.c(); if(!c) return; const n=c.currentTime;
    [0,.22,.44].forEach(d=>this.tone(880, n+d, .16, 'square', .07)); },
};

const Fx = {

      s.style.setProperty('--s', (32 + Math.random()*34) + 'px');
      s.style.animationDelay = (Math.random()*.6) + 's';
      this.layer.appendChild(s);
      setTimeout(() => s.remove(), 3600);
    }
  },
  shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'), 520); },
  /* قصاصات احتفالية */
  confetti(amount=150){
    const cv = $('#confetti'), ctx = cv.getContext('2d');
    cv.width = innerWidth; cv.height = innerHeight;
    const colors = ['#8B5CF6','#60A5FA','#F59E0B','#EC4899','#10B981','#C4B5FD'];
    const P = (this._p = (this._p || []));
    for (let i=0;i<amount;i++) P.push({
      x: innerWidth/2 + (Math.random()-.5)*innerWidth*.5, y: innerHeight*.35,
      vx: (Math.random()-.5)*16, vy: -Math.random()*16-6, s: 6+Math.random()*8,
      r: Math.random()*6, vr: (Math.random()-.5)*.3, c: colors[i%colors.length], life: 160+Math.random()*60 });
    if (this._run) return;
    this._run = true;
    const loop = () => {
      ctx.clearRect(0,0,cv.width,cv.height);
      for (let i=P.length-1;i>=0;i--){
        const p = P[i]; p.vy += .42; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.min(1, p.life/40);
        ctx.fillStyle = p.c; ctx.fillRect(-p.s/2, -p.s/3, p.s, p.s*.66); ctx.restore();
        if (p.life <= 0 || p.y > cv.height+40) P.splice(i,1);
      }
      if (P.length) requestAnimationFrame(loop); else { this._run = false; ctx.clearRect(0,0,cv.width,cv.height); }
    };
    loop();
  },
};

function makeTimer(root){
  const C = 2*Math.PI*52, fg = $('.tm-fg',root), txt = $('.tm-txt',root), go = $('[data-t=go]',root);
  let total = +root.dataset.sec || 60, left = total, id = null;
  fg.style.strokeDasharray = C;
  const draw = () => { txt.textContent = fmt(left); fg.style.strokeDashoffset = C*(1-left/total); root.classList.toggle('warn', left<=10 && left>0); };
  const stop = () => { clearInterval(id); id = null; go.textContent = '▶ ابدئي'; };
  const start = () => {
    if (id || total<=0) return;
    if (left<=0) left = total;
    root.classList.remove('done'); go.textContent = '⏸ إيقاف';
    id = setInterval(() => {
      left--; draw();
      if (left<=5 && left>0) Sound.tick();
      if (left<=0){ stop(); root.classList.add('done'); Sound.timeUp(); Fx.toast('⏰ انتهى الوقت!'); }
    }, 1000);
  };
  const api = {
    start, stop,
    reset(){ stop(); left = total; root.classList.remove('done','warn'); draw(); },
    set(sec){ stop(); total = sec; left = sec; root.classList.remove('done','warn'); draw(); },
  };
  go.onclick = () => id ? stop() : start();
  $('[data-t=reset]',root).onclick = api.reset;
  draw(); root._timer = api; return api;
}

          <button class="lop" data-op="append">append(x)<small>إضافة للنهاية</small></button>
          <button class="lop" data-op="remove">remove(x)<small>حذف عنصر</small></button>
          <button class="lop" data-op="count">count(x)<small>عدد مرات الظهور</small></button>
          <button class="lop" data-op="sort">sort()<small>ترتيب تصاعدي</small></button>
          <button class="lop" data-op="reverse">reverse()<small>عكس الترتيب</small></button>
          <button class="lop" data-op="clear">clear()<small>حذف الكل</small></button>

    init(el,d){
      let arr=[...d.start], log=[]; const box=$('.lab-list',el), inp=$('.lab-in',el), term=$('.term-body',el), N=d.name;
      const parse=s=>{ s=s.trim(); if(!s) return null; return /^-?\d+(\.\d+)?$/.test(s)?Number(s):s.replace(/^["']|["']$/g,''); };
      const lit=v=>typeof v==='number'?String(v):`"${v}"`, rep=v=>typeof v==='number'?String(v):`'${v}'`;
      const repr=()=>`[${arr.map(rep).join(', ')}]`;
      const draw=(flash=-1,match)=>{ box.innerHTML = arr.length ? arr.map((v,k)=>`<div class="lchip ${k===flash?'new':''} ${match!==undefined&&v===match?'match':''}"><small>${k}</small><span>${esc(rep(v))}</span></div>`).join('') : `<div class="lempty">القائمة فارغة</div>`; };
      const code=()=>setCode($('.lcode',el),[`${N} = [${d.start.map(lit).join(', ')}]`,...log].join('\n'));
      const run=(line,out,err)=>{ log.push(line); if(log.length>6) log.shift(); code(); typeOut(term,out,err); };
      const val=def=>{ const v=parse(inp.value); return v===null?def:v; };
      const ops={
        append(){ const v=val(100); arr.push(v); draw(arr.length-1); run(`${N}.append(${lit(v)})`,repr()); },
        remove(){ const v=val(88), k=arr.findIndex(x=>x===v);
          if (k<0){ run(`${N}.remove(${lit(v)})`,'ValueError: list.remove(x):\nx not in list',true); Fx.shake(box); return; }
          arr.splice(k,1); draw(); run(`${N}.remove(${lit(v)})`,repr()); },
        count(){ const v=val(88), c=arr.filter(x=>x===v).length; draw(-1,v); run(`print(${N}.count(${lit(v)}))`,String(c)); },
        sort(){ const types=new Set(arr.map(x=>typeof x));
          if (types.size>1){ run(`${N}.sort()`,"TypeError: '<' not supported between\ninstances of 'str' and 'int'",true); Fx.shake(box); return; }
          arr.sort((a,b)=>typeof a==='number'?a-b:(a<b?-1:a>b?1:0)); draw(); run(`${N}.sort()`,repr()); },
        reverse(){ arr.reverse(); draw(); run(`${N}.reverse()`,repr()); },
        clear(){ arr=[]; draw(); run(`${N}.clear()`,'[]'); },
        reset(){ arr=[...d.start]; log=[]; draw(); code(); term.textContent=''; },
      };
      $$('.lop',el).forEach(b=>b.addEventListener('click',()=>{ ops[b.dataset.op](); if(b.dataset.op!=='reset') Sound.pop(); }));
      inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); ops.append(); } });

   🎬 بناء العرض والتنقل
   ===================================================================== */
const stage = $('#stage');
const mcqs = SLIDES.filter(s=>s.type==='mcq'); mcqs.forEach((s,k)=>{ s._n=k+1; s._of=mcqs.length; });
const slides = SLIDES.map(d => {
  const s = document.createElement('section');
  s.className = `slide t-${d.transition||'fade'} type-${d.type}`;
  if (!T[d.type]){ s.innerHTML = `<div class="center-col"><h2>نوع شريحة غير معروف: ${d.type}</h2></div>`; stage.appendChild(s); return s; }
  s.innerHTML = T[d.type].render(d);
  stage.appendChild(s);
  $$('.anim',s).forEach((a,k)=>a.style.setProperty('--i',k));
  $$('.timer',s).forEach(makeTimer);
  if (T[d.type].init) T[d.type].init(s,d);
  return s;
});
const N = slides.length;
let cur = 0;
const hashN = parseInt(location.hash.slice(1),10);
if (hashN>=1 && hashN<=N) cur = hashN-1;
slides[cur].classList.add('active');

function updateUI(){
  $('#counter').textContent = `${cur+1} / ${N}`;
  $('#progress').style.width = ((cur+1)/N*100) + '%';
  $('#btnPrev').disabled = cur===0;
  $('#btnNext').disabled = cur===N-1;
  try{ history.replaceState(null,'','#'+(cur+1)); }catch(e){}
}
function go(i){
  if (i<0 || i>=N || i===cur) return;
  const old = slides[cur], nw = slides[i];
  stage.style.setProperty('--dx', i>cur ? '-140px' : '140px');   /* RTL: التالية تأتي من اليسار */
  old.classList.remove('active'); old.classList.add('leave');
  setTimeout(()=>old.classList.remove('leave'), 750);
  nw.classList.add('enter'); void nw.offsetWidth;
  nw.classList.remove('enter'); nw.classList.add('active');
  cur = i; updateUI();
}
const next = () => go(cur+1), prev = () => go(cur-1);

/* أزرار التحكم */
$('#btnNext').onclick = next;
$('#btnPrev').onclick = prev;
$('#btnClap').onclick = doClap;
$('#btnFull').onclick = () => {
  if (!document.fullscreenElement) (document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen||function(){}).call(document.documentElement);
  else (document.exitFullscreen||document.webkitExitFullscreen).call(document);
};

/* لوحة المفاتيح */
const isTyping = t => t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.isContentEditable);
document.addEventListener('keydown', e => {
  if (isTyping(e.target)){ if (e.key==='Escape') e.target.blur(); return; }
  if (e.key==='ArrowRight' || e.key===' ' || e.code==='Space' || e.key==='PageDown'){ e.preventDefault(); next(); }
  else if (e.key==='ArrowLeft' || e.key==='PageUp' || e.key==='Backspace'){ e.preventDefault(); prev(); }
  else if (e.key==='ArrowUp' || e.key==='ArrowDown'){ e.preventDefault(); }
  else if (e.key==='Home'){ e.preventDefault(); go(0); }
  else if (e.key==='End'){ e.preventDefault(); go(N-1); }
  else if (e.key==='ت' || e.key==='f' || e.key==='F'){ e.preventDefault(); doClap(); }
  else if (e.key==='Enter' && e.target.getAttribute && e.target.getAttribute('role')==='button'){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('keyup', e => { if ((e.code==='Space'||e.key===' ') && !isTyping(e.target)) e.preventDefault(); });
/* إزالة التركيز بعد الضغط حتى لا يضغط Space الزر مرة أخرى */
document.addEventListener('click', e => { const b = e.target.closest('button,[role=button]'); if (b) setTimeout(()=>b.blur(), 0); });
addEventListener('wheel', e => { if (!e.ctrlKey) e.preventDefault(); }, { passive:false });

/* إخفاء شريط التحكم تلقائيًا عند توقف الماوس */
let idleT;
function wake(){
  document.body.classList.remove('idle'); clearTimeout(idleT);
  idleT = setTimeout(()=>{ if (!$('#controls').matches(':hover')) document.body.classList.add('idle'); }, 2600);
}
['mousemove','pointerdown','touchstart'].forEach(ev => addEventListener(ev, wake, { passive:true }));

/* ملاءمة المسرح لأي شاشة مع الحفاظ على 16:9 */
function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit);
fit(); updateUI(); wake();
</script>
